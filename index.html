
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Interactive 3D Product</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #f2f2f0;
    }
    babylon-viewer {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
  <script type="module"
    src="https://cdn.jsdelivr.net/npm/@babylonjs/viewer/dist/babylon-viewer.esm.min.js">
  </script>
</head>
<body>
  <babylon-viewer
    source="./model.glb"
    camera-orbit="0deg 70deg 105%"
    camera-target="0m 0m 0m"
    environment="studio"
    touch-action="pan-y">
  </babylon-viewer>
</body>
</html>
